minimum_pre_commit_version: "4.6.0"

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --frozen ruff check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format-check
        name: Ruff format
        entry: uv run --frozen ruff format --check .
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-coverage
        name: Pytest with 90% coverage
        entry: env -u GIT_INDEX_FILE uv run --frozen pytest
        language: system
        pass_filenames: false
        always_run: true
