schema_version: 1

index:
  tokenizer: unicode61
  remove_diacritics: 2

retrieval:
  query_mode: all-terms
  result_limit: 5
  title_weight: 5.0
  heading_weight: 2.0
  body_weight: 1.0
  tie_breaker: passage-id

agent:
  retrieval_budget: 4
  temperature: 0.0
  max_output_tokens: 1024

provider:
  request_timeout_seconds: 60
  attempt_timeout_seconds: 300
  max_retries: 1

runner:
  max_concurrency: 5

report:
  evidence_excerpt_characters: 1200
