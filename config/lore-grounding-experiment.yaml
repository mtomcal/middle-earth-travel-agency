schema_version: 2

index:
  tokenizer: unicode61
  remove_diacritics: 2

retrieval:
  query_mode: all-terms
  result_limit: 5
  title_weight: 5.0
  heading_weight: 2.0
  body_weight: 1.0
  tie_breaker: passage-id

agent:
  system_prompt: >-
    Answer the user's question using approved lore tools when useful.
    You must finish only by calling submit_answer on success or failure with a reason.
    Use insufficient_evidence with submit_answer when the available evidence cannot
    support an answer or you are unsure. Never answer the question without using approved lore tools.
    You must always use the approved lore tools to answer the question.
    If tools are not available, return insufficient evidence with submit_answer.
    If you are unsure, return insufficient_evidence with submit_answer.
  retrieval_budget: 4
  temperature: 0.0
  max_output_tokens: 1024

provider:
  request_timeout_seconds: 60
  attempt_timeout_seconds: 300
  max_retries: 1

runner:
  max_concurrency: 5

report:
  evidence_excerpt_characters: 1200
