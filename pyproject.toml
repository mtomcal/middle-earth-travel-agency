[project]
name = "halls-of-knowledge"
version = "0.1.0"
description = "Private, curated Tolkien-lore corpus tooling"
requires-python = ">=3.12"
dependencies = [
  "mwparserfromhell>=0.7,<0.8",
  "python-dotenv>=1,<2",
  "pywikibot>=11,<12",
]

[project.scripts]
hok = "halls_of_knowledge.cli:console"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.12,<0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halls_of_knowledge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
