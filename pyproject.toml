[project]
name = "middle-earth-travel-agency"
version = "0.1.0"
description = "Agentic Middle-earth travel-guide demo with curated lore grounding"
requires-python = ">=3.12"
dependencies = [
  "mwparserfromhell>=0.7,<0.8",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
  "pywikibot>=11,<12",
]

[project.scripts]
meta = "middle_earth_travel_agency.cli:console"

[dependency-groups]
dev = [
  "pre-commit>=4.6,<5",
  "pyright>=1.1,<2",
  "pytest>=8,<9",
  "pytest-cov>=7.1,<8",
  "ruff>=0.12,<0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/middle_earth_travel_agency"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=middle_earth_travel_agency --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.report]
fail_under = 90
precision = 2
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venv = ".venv"
venvPath = "."
