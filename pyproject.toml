[project]
name = "middle-earth-travel-agency"
version = "0.1.0"
description = "Agentic Middle-earth travel-guide demo with curated lore grounding"
requires-python = ">=3.12"
dependencies = [
  "mwparserfromhell>=0.7,<0.8",
  "python-dotenv>=1,<2",
  "pywikibot>=11,<12",
]

[project.scripts]
meta = "middle_earth_travel_agency.cli:console"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.12,<0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/middle_earth_travel_agency"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
